<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ title }}</title><link rel="stylesheet" href="/static/css/style.css?v=brand3"></head><body class="admin-body">{% include '_admin_nav.html' %}<main class="shell admin-main admin-form-wrap"><a class="back-link" href="/admin/products">← Back to products</a><div class="admin-title"><div><span class="eyebrow">YOUR CREATIONS</span><h1>{% if product %}Edit your product{% else %}Add a new product{% endif %}</h1><p>Changes appear on the storefront immediately after saving.</p></div></div>{% if error %}<div class="form-error">{{ error }}</div>{% endif %}<form method="post" action="/admin/products/save" enctype="multipart/form-data" class="admin-form-card"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="id" value="{{ product.id if product else '' }}"><div class="field-grid"><label class="field full">Product name *<input name="name" value="{{ product.name if product else '' }}" required maxlength="100" placeholder="e.g. Daisy Keychain"></label><label class="field">Product URL slug<input name="slug" value="{{ product.slug if product else '' }}" placeholder="daisy-keychain"><small>Optional for new products. Lowercase letters and hyphens.</small></label><label class="field">Category *<input name="category" value="{{ product.category if product else 'Keychains' }}" required maxlength="50"></label><label class="field">Price in ₹ *<input name="price" type="number" value="{{ product.price if product else '' }}" min="20" max="100000" required></label><label class="field">Display position<input name="position" type="number" value="{{ product.position if product else 99 }}"></label><label class="field full">Product description *<textarea name="description" maxlength="1000" rows="4" required>{{ product.description if product else '' }}</textarea></label><label class="field">Small badge (optional)<input name="badge" value="{{ product.badge if product else '' }}" maxlength="40" placeholder="e.g. New arrival"></label><label class="field">Product photo {% if not product %}*{% endif %}<input name="image_file" type="file" accept="image/jpeg,image/png,image/webp" {% if not product %}required{% endif %}><small>JPG/PNG/WebP · max 5 MB</small></label></div>{% if product %}<div class="upload-preview"><img src="{{ product.image }}" alt="Current product photo"><span>Current product photo</span></div>{% endif %}<label class="check-label"><input name="active" type="checkbox" {% if not product or product.active %}checked{% endif %}> Show this product in my shop</label><button class="btn btn-dark" type="submit">Save product ↗</button></form></main></body></html>
